services:
  mysql:
    image: mysql:8.0
    container_name: induztek-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_CLAVE:-induztek}
    ports:
      - "3306:3306"
    volumes:
      - mysql-datos:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  api-gateway:
    build: ./api-gateway
    container_name: induztek-gateway
    restart: unless-stopped
    environment:
      SERVICIOS_AUTENTICACION_URL: http://autenticacion:8081
      SERVICIOS_INSTALACIONES_URL: http://instalaciones:8082
      SERVICIOS_PROTOCOLOS_URL: http://protocolos:8083
    ports:
      - "8080:8080"

volumes:
  mysql-datos:
