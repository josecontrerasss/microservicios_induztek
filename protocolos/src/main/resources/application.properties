spring.application.name=protocolos
server.port=8083

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/protocolos}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:induztek}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secreto=${JWT_SECRETO:induztek-secreto-de-desarrollo-cambiar-en-produccion-2026}

springdoc.swagger-ui.path=/swagger-ui.html

servicios.instalaciones.url=${SERVICIOS_INSTALACIONES_URL:http://localhost:8082}
