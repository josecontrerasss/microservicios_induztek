spring.application.name=autenticacion
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/autenticacion}
spring.datasource.username=${DB_USUARIO:root}
spring.datasource.password=${DB_CLAVE:induztek}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PUERTO:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

jwt.secreto=${JWT_SECRETO:induztek-secreto-de-desarrollo-cambiar-en-produccion-2026}
jwt.horas-validez=8

recuperacion.minutos-validez=15
recuperacion.remitente=${MAIL_USUARIO:no-responder@induztek.cl}

springdoc.swagger-ui.path=/swagger-ui.html
