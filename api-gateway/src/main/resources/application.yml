server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: ruta-autenticacion
              uri: lb://autenticacion
              predicates:
                - Path=/api/auth/**,/api/usuarios/**
              filters:
                - StripPrefix=1

            - id: ruta-instalaciones
              uri: lb://instalaciones
              predicates:
                - Path=/api/instalaciones/**,/api/asignaciones/**,/api/tecnicos/*/empresas,/api/equipos/**,/api/visitas/**,/api/tipos-equipo,/api/clientes/*/instalaciones,/api/clientes/*/visitas,/api/clientes/*/tecnicos,/api/tecnicos/*/instalaciones,/api/tecnicos/*/visitas,/api/tecnicos/*/equipos
              filters:
                - StripPrefix=1

            - id: ruta-protocolos
              uri: lb://protocolos
              predicates:
                - Path=/api/protocolos/**,/api/clientes/*/protocolos,/api/tecnicos/*/protocolos
              filters:
                - StripPrefix=1

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
